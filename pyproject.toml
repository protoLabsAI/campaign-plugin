[project]
name = "campaign"
version = "0.1.0"            # keep in lockstep with protoagent.plugin.yaml and __init__.__version__
description = "Campaign Studio — campaign plans + deterministic media production (shot scripts, Playwright takes, ffmpeg renders, cards) for protoAgent."
requires-python = ">=3.11"
# The host (protoAgent) provides langchain-core, fastapi and pyyaml. playwright is the one
# runtime addition — declared in the manifest's requires_pip (optional, scope: host).
dependencies = ["playwright>=1.45"]

[dependency-groups]
dev = [
  "fastapi>=0.110",
  "langchain-core>=0.2",
  "pyyaml>=6",
  "httpx>=0.27",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.uv]
package = false   # a plugin directory, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: drives a real Chromium and/or ffmpeg; skipped when they're absent",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Mirrors protoAgent's own selection so local runs and CI agree.
select = ["E", "F", "W"]
ignore = [
  "E402",  # module-level import not at top — late/lazy imports are how host imports stay lazy here
  "E501",  # line-too-long — long, readable comment lines are intentional
]
