id: campaign
name: Campaign Studio
version: 0.6.4
description: >-
  Campaign plans and deterministic, repeatable media production for launching ANY app or
  product. Plans hold the goal and its math, lanes, a shot list of assets (who records what),
  milestones, and the decisions only the operator can make. Declarative shot scripts drive
  headless Chromium (Playwright) to record takes with named marks and stills; ffmpeg cuts
  them into H.264 mp4s, palette-optimised GIFs and posters held under documented hard size
  limits; branded HTML cards render to PNG (social preview, 16:9, square, end slide); montages
  cut many short themed beats + tagline/end cards into one launch video with colour-wipe
  transitions (landscape, vertical, square), reviewed first as a storyboard. Adds a background
  producer subagent, four skills, and an asset gallery for approving what ships.
  Draft-only: it never posts to a social platform, holds no platform credentials, and only the
  operator approves. Approved media can be backed up to protoContent (GitHub release assets +
  a catalog PR) as a GitHub App (repo-scoped installation tokens) or with an operator-set token. Daily retention prunes old intermediates
  (report-only until the operator turns it on); collections gather keepers into a campaign.
  Copy is Social Studio's job and browsing is agent_browser's — referenced by name, never
  imported.
# Provenance (ADR 0027) — shown in the install review when added by git URL.
repository: "https://github.com/protoLabsAI/campaign-plugin"
guide_url: "https://github.com/protoLabsAI/campaign-plugin#quick-start"
# register_setup_step (the Install Chromium banner button) shipped in v0.165.0; we floor at the
# current core so the gallery's DS kit, sdk.plugin_store and the install_deps action are all there.
min_protoagent_version: "0.188.0"

# Declarative posture (ADR 0071). The plugin's Python makes ONE kind of outbound call: archive.py
# backs approved media up to GitHub (api.github.com / uploads.github.com only — refused for any
# other host) as the operator's GitHub App (archive_app_id + archive_app_private_key → a JWT →
# an installation token scoped to archive_repo only) or with the operator's `archive_token`, and
# only while `archive_enabled` is on. Its
# recording browser (Playwright) loads whatever `base_url` / `goto` URLs a shot script names, and
# that page pulls in whatever it links to. So, like agent_browser: "*".
# Guards (enforced inside the out-of-process browser worker): the browser never reaches this
# plugin's own data API (no self-approval), and a script's bearer goes only to its base_url
# origin, read only from CAMPAIGN_* / `bearer_envs` env vars and handed to the worker on stdin.
# Card rendering loads nothing remote (every request from a card page is aborted).
capabilities:
  network: ["*"]
  filesystem: scoped        # the plan db + every take/render/card, under the plugin data dir
enabled: false              # author default — operators opt in via plugins.enabled

# Declared, NOT auto-installed (ADR 0027 D4). `scope: runtime` because the plugin NEVER imports
# playwright in the host process: every browser runs in worker/pw_worker.py under a separate
# interpreter (interpreter setting → the managed Python runtime → the agent's own Python when
# not frozen). So on the desktop app Install dependencies pips it into the managed runtime
# (ADR 0094 P2 — provision it first in Settings ▸ Tools); on a source install, into the agent's
# venv. A frozen app can't add playwright to ITSELF (platform wheels + a Node driver), which is
# why v0.1's `scope: host` could never be satisfied there. `optional` because planning works
# without it and every media tool degrades to an actionable message. Its Chromium (~150 MB)
# installs only from the banner's Install Chromium button, with that same interpreter. ffmpeg is
# a system binary — the banner says how to get it.
requires_pip:
  - { pkg: "playwright>=1.45", optional: true, scope: runtime }
  # The GitHub App archive signs an RS256 JWT IN-PROCESS (archive.py), so `scope: host`. The host
  # already ships it: protoAgent's `mcp` dependency requires `pyjwt[crypto]` (and the desktop
  # sidecar --collect-all's mcp). `optional` because only the app auth mode needs it — the token
  # mode and everything else run without it, and a missing one is a readable archive problem.
  - { pkg: "PyJWT[crypto]>=2.4", optional: true, scope: host }

config_section: campaign
config:
  data_dir: ""              # plan db + media; blank = the host's per-instance plugin store
  ffmpeg_path: ""           # blank = ffmpeg on PATH (ffprobe is looked up beside it)
  interpreter: ""           # Python that runs the browser worker; blank = managed runtime, else the agent's own
  brand_kit_path: ""        # Social Studio brand-kit YAML to READ colours/fonts/logo from; blank = auto-detect
  brand_name: ""            # fallbacks when no brand kit sets them
  brand_colors: ""          # "bg=#0d0f14, fg=#f4f5f7, accent=#7c5cff, muted=#9aa0ac"
  brand_fonts: ""           # "heading=Inter, body=Inter" (installed font family names)
  brand_logo: ""            # path to a logo image (png/svg/jpg)
  limit_overrides: ""       # YAML: {limit_id: {max_bytes: 100000000, source: ..., as_of: ...}}
  producer_model: ""        # model override for the campaign_producer subagent; blank = host routing
  bearer_envs: ""           # extra env-var NAMES a shot script may use as auth.bearer_env (CAMPAIGN_* always may)
  upload_dirs: ""           # dirs an `upload` step may read files from (comma/newline separated); blank = uploads refused
  outro: ""                 # YAML: the brand outro a montage appends with {outro: true} — beat, bumper, CTA card
  intro: ""                 # YAML: the brand intro a montage prepends with {intro: true} — bumper, title card, crossfade
  retention_mode: report    # report (daily dry run, the default) | prune (delete per policy) | disabled
  archive_enabled: false    # back approved media up to protoContent (release assets + a catalog PR)
  archive_repo: "protoLabsAI/protoContent"
  archive_catalog_dir: "specs/media/catalog"
  archive_app_id: 0         # GitHub App id (protoquinn = 3282126); 0 = off. Set → the app wins over archive_token
  archive_app_installation_id: 0   # the app's installation; 0 = find it via GET /repos/{archive_repo}/installation
  archive_app_private_key: ""      # SECRET — the app's PEM private key (multi-line; a one-line paste is re-wrapped)
  archive_app_private_key_path: "" # …or a path to the .pem file (used only when the secret is blank)
  archive_token: ""         # SECRET — fine-grained PAT on archive_repo only: Contents RW + Pull requests RW
secrets: [archive_app_private_key, archive_token]    # → secrets.yaml, redacted in the UI; never logged
# `spawns: true` marks a setting that names a program this plugin RUNS, so the agent's own
# set_config tool refuses to write it (protoAgent ADR 0019 §3b) — the operator sets it from
# Settings. `interpreter` is also fenced by name; `ffmpeg_path` is fenced only by the marker.
# `upload_dirs` carries the same marker for the same reason in a different shape: it decides
# which local files an agent-written script may hand to a web page (an exfiltration path), so
# the agent must never widen it itself; `outro` likewise, because its bumper names a local file the
# montage reads. `retention_mode` carries it too: flipping it to `prune` is what lets files be
# DELETED, and that switch is the operator's — the agent must never turn deletion on for itself.
# `archive_enabled` / `archive_repo` / `archive_catalog_dir` carry it because they decide WHETHER
# and WHERE approved media is sent with the operator's credentials; `archive_app_id` /
# `archive_app_installation_id` / `archive_app_private_key_path` because they decide WHICH identity
# it acts as (and the path names a local key file the plugin reads).
# The marker is core's only per-key operator-only fence.
# Older cores ignore the field.
settings:
  - { key: data_dir, label: "Data directory", type: string, group: "Campaign Studio", description: "Where the campaign database and every take, render and card live. Blank uses the host's per-instance plugin store." }
  - { key: ffmpeg_path, label: "ffmpeg path", type: string, spawns: true, group: "Campaign Studio", description: "Absolute path to ffmpeg when it isn't on PATH. ffprobe is looked up next to it." }
  - { key: interpreter, label: "Browser worker Python", type: string, spawns: true, group: "Campaign Studio", description: "Absolute path to a Python interpreter that has the playwright package, used to run the out-of-process browser worker. Blank uses the desktop app's managed Python runtime (Settings ▸ Tools), or the agent's own Python on a source install." }
  - { key: brand_kit_path, label: "Brand kit file", type: string, group: "Brand look", description: "A Social Studio brand-kit YAML to read card colours, fonts and logo from (visual.colors / visual.fonts / visual.logo). Blank auto-detects Social Studio's kit. Read-only — this plugin never writes it." }
  - { key: brand_name, label: "Brand name", type: string, group: "Brand look", description: "Fallback brand name for cards when no brand kit provides one." }
  - { key: brand_colors, label: "Brand colours", type: string, group: "Brand look", description: "Fallback card colours as hex pairs, e.g. bg=#0d0f14, fg=#f4f5f7, accent=#7c5cff, muted=#9aa0ac." }
  - { key: brand_fonts, label: "Brand fonts", type: string, group: "Brand look", description: "Fallback font families installed on this machine, e.g. heading=Inter, body=Inter." }
  - { key: brand_logo, label: "Brand logo", type: string, group: "Brand look", description: "Fallback logo image path (png, svg or jpg) for cards." }
  - { key: limit_overrides, label: "Hard-limit overrides", type: string, group: "Campaign Studio", description: "YAML mapping of limit id → fields to override or add, e.g. github_attachment_video_free: {max_bytes: 100000000, source: <url>, as_of: 2026-10-01} on a paid plan. Each row should carry its source and date." }
  - { key: outro, label: "Brand outro", type: string, spawns: true, group: "Brand look", description: "YAML for the outro a montage appends with a last item {outro: true}: caption_hold_s, min_caption_s, caption_fade_s, beat_s, transition, bumper: {path, in, out} (a recorded bumper clip — a file path, so operator-only), cta: {template: cta-slide, eyebrow, title, subtitle, cta, url, duration}. See the README's Outro section." }
  - { key: intro, label: "Brand intro", type: string, spawns: true, group: "Brand look", description: "YAML for the intro a montage prepends with a first item {intro: true} (and campaign_produce_video uses by default): bumper: {path, in, out} (or `outro` to reuse the outro's bumper file), card: {template: title-slide, eyebrow, title, subtitle, duration}, transition: {style: fade, duration: 0.6} (always a crossfade into the first shot), max_s (default 6 — a longer intro is refused). See the README's Intro section." }
  - { key: bearer_envs, label: "Shot-script bearer env vars", type: string, group: "Campaign Studio", description: "Comma-separated environment variable NAMES a shot script may send as its bearer token (auth.bearer_env), besides any CAMPAIGN_* variable. The token goes only to the script's base_url origin. The host's own operator/fleet tokens are always refused." }
  - { key: upload_dirs, label: "Upload folders", type: string, spawns: true, group: "Campaign Studio", description: "Comma- or newline-separated absolute folders a shot script's upload step may hand files from (symlinks resolved, regular files only, 50 MB each). Blank refuses every upload. Key/credential files, credential dirs (.ssh, .aws, …) and the agent's home (~/.protoagent) are refused even inside these; the filesystem root, your home dir or a parent of it, and the agent's home are ignored as too broad. Point it at a folder of demo files the agent can't write into. Operator-only: marked so the agent can't widen it itself." }
  - { key: retention_mode, label: "Retention", type: select, options: [report, prune, disabled], spawns: true, group: "Library", description: "What the daily retention pass does. report (default) = a dry run only: it lists what would go, with sizes, and deletes nothing. prune = delete per policy: superseded files after 7 days (row kept as a tombstone), rendered/captured intermediates after 7 days unless an approved or ready-for-review asset depends on them, planned rows with no file after 30 days. Approved and ready-for-review assets are never deleted; ready-for-review ones idle 14+ days are flagged stale. disabled = no pass." }
  - { key: archive_enabled, label: "Back up approved media", type: bool, spawns: true, group: "Library", description: "Upload every asset you approve to the archive repo — the file as a release asset (release media/<campaign>, never 'latest'), plus an entry in the campaign's catalog JSON, committed on one open PR per campaign that you merge. Same file = uploaded once. Needs a credential: the GitHub App (app id + private key) or the archive token." }
  - { key: archive_repo, label: "Archive repo", type: string, spawns: true, group: "Library", description: "owner/name of the repo approved media is backed up to. Operator-only: it decides where your media is sent." }
  - { key: archive_catalog_dir, label: "Catalog folder", type: string, spawns: true, group: "Library", description: "Folder in the archive repo for the per-campaign catalog JSON (<folder>/<campaign-slug>.json). protoContent's convention: specs/media/catalog, validating against schemas/media/catalog.schema.json." }
  - { key: archive_app_id, label: "Archive GitHub App id", type: number, minimum: 0, spawns: true, group: "Library", description: "The GitHub App the backup acts as (protoquinn: 3282126). 0 = off (use the token below). When set, the app wins over the archive token: each pass mints an installation access token scoped to the archive repo ONLY, with Contents and Pull requests write, cached until 5 minutes before it expires. Commits and the catalog PR are authored by the app's bot (protoquinn[bot]), which may merge the catalog PR once protoContent's CI is green." }
  - { key: archive_app_installation_id, label: "Archive GitHub App installation id", type: number, minimum: 0, spawns: true, group: "Library", description: "The app's installation id (protoquinn on protoLabsAI: 121562683). 0 = find it from the archive repo (GET /repos/{archive_repo}/installation)." }
  - { key: archive_app_private_key, label: "Archive GitHub App private key", type: secret, group: "Library", description: "The app's private key — paste the whole .pem file, from -----BEGIN RSA PRIVATE KEY----- to -----END RSA PRIVATE KEY-----. This field is one line, so the newlines are dropped on paste; the plugin re-wraps the key, so that's fine. Stored in secrets.yaml; never logged or shown." }
  - { key: archive_app_private_key_path, label: "Archive GitHub App private key file", type: path, path_kind: file, spawns: true, group: "Library", description: "Alternatively, an absolute path to the app's .pem file. Used only when the private key above is blank. Keep the file owner-readable only (chmod 600)." }
  - { key: archive_token, label: "Archive GitHub token", type: secret, group: "Library", description: "A fine-grained personal access token with access to the archive repo ONLY and these repository permissions: Contents — read and write (releases, release assets, the catalog branch and commit); Pull requests — read and write (open the catalog PR). Metadata — read is included automatically. Used only when no GitHub App id is set. Stored in secrets.yaml; never logged." }
  - { key: producer_model, label: "Producer model", type: string, group: "Crew models", description: "Model override for the campaign_producer subagent. Blank rides the host's aux-model routing." }

# Console rail view (ADR 0026) — browsing only: every asset of a campaign, playable, with
# status/size/dims and the operator-only approve/reject/supersede buttons.
views:
  - { id: gallery, label: "Campaign Studio", icon: "Clapperboard", path: /plugins/campaign/view }

# The host's auth gate matches these as PREFIXES (a2a_impl/auth.py `_is_public`), and a fleet hub
# defers /agents/<slug>/plugins/… to this list (graph/fleet/member_public.py). `open/` is the
# gallery's "Open in new tab": public so a bearer-less browser tab can load it, but it serves a
# file only for a 15-minute HMAC-signed link minted by the GATED /api/plugins/campaign/assets/<id>/open-link.
public_paths:
  - /plugins/campaign/view
  - /plugins/campaign/open/

# Event bus (ADR 0039) — auto-namespaced campaign.*.
emits:
  - campaign_changed
  - asset_registered
  - shoot_finished
  - render_finished
  - asset_reviewed
  - video_finished
