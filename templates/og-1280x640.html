<!-- og-1280x640 — repository / link social preview. Title-led; an optional screenshot bleeds off the right edge. -->
<div class="card og {{layout}}">
  <div class="glow"></div>
  <div class="copy">
    <div class="top">{{logo_html}}<span class="brand">{{brand}}</span></div>
    <div class="mid">
      <div class="eyebrow">{{eyebrow}}</div>
      <h1>{{title}}</h1>
      <p class="sub">{{subtitle}}</p>
    </div>
    <div class="bottom"><span class="url">{{url}}</span><span class="footer">{{footer}}</span></div>
  </div>
  {{image_html}}
</div>
