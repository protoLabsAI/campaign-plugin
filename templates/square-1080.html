<!-- square-1080 — 1:1 for feeds that crop to square. Centered headline above the shot. -->
<div class="card square {{layout}}">
  <div class="glow"></div>
  <div class="copy">
    <div class="top">{{logo_html}}<span class="brand">{{brand}}</span></div>
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
  </div>
  {{image_html}}
  <div class="bottom"><span class="url">{{url}}</span></div>
</div>
