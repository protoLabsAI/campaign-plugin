<!-- x-card-1600x900 — a 16:9 in-feed card. Headline on top, the product shot does the talking. -->
<div class="card wide {{layout}}">
  <div class="glow"></div>
  <div class="copy">
    <div class="top">{{logo_html}}<span class="brand">{{brand}}</span><span class="eyebrow inline">{{eyebrow}}</span></div>
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
  </div>
  {{image_html}}
  <div class="bottom"><span class="url">{{url}}</span><span class="footer">{{footer}}</span></div>
</div>
