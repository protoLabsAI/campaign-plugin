<!-- cta-slide-1920x1080 — a call-to-action end card: logo, eyebrow, line, a big accent button, the URL. -->
<div class="card slide cta {{layout}}">
  <div class="glow"></div>
  <div class="center">
    {{logo_html}}
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
    <div class="button">{{cta}}</div>
    <div class="url">{{url}}</div>
  </div>
  <div class="bottom"><span class="footer">{{footer}}</span></div>
</div>
