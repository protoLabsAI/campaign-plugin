<!-- title-slide-1920x1080 — an end frame / title slide for a clip. Logo, line, URL; nothing else. -->
<div class="card slide {{layout}}">
  <div class="glow"></div>
  <div class="center">
    {{logo_html}}
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
    <div class="url pill">{{url}}</div>
  </div>
  <div class="bottom"><span class="footer">{{footer}}</span></div>
</div>
